[[blip]]
entry = "claude-haiku-5-5"
status = "confirmed"
rationale = """
Haiku 5.5 is Anthropic's smallest and fastest Claude model. For well-defined jobs it gives me the best value. My helper agents use it for small, clear tasks. Helper agents are agents that my main agent starts for one part of a job.

A Haiku agent clicks through each change as a user would, like a tester. It also clicks and types in Mac apps for my agents. This week helper agents sent it 14,224 requests.

Haiku is not very smart, and that is fine for these jobs. The effort setting decides how long a model thinks. Even on high effort, Haiku costs less than Sonnet on low effort. So I now swap Sonnet for Haiku wherever a test shows Haiku is good enough. That use keeps it in Adopt."""
