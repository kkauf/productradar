# Konstantin's radar: the curated radar of the site. Opinions live here; facts live in data/entries/.
# `title` is the name visitors see for this radar on every page, card and feed.
# Every ring change is a [[blip.history]] item dated to an edition, with a note on why.
title = "Konstantin's radar"
owner = "Konstantin Kaufmann"
kind = "curated"
description = "Konstantin Kaufmann's verdicts on the models, tools, infrastructure and practices he has used to build and run his products."

[[edition]]
date = 2026-10-12
title = "The starting radar"
note = "The tools and practices from my own work, each in its ring."

[[edition]]
date = 2026-10-22
title = "T3 Code and Haiku move in, Codex goes to Hold"
note = "My daily work moved to Opus 5.5, Haiku 5.5 and T3 Code, and I dropped Codex. I also stopped my own review of agent work and now rely on automatic checks."
body = """
Anthropic's Claude models Opus, Sonnet and Haiku go from largest to smallest. Fable is Anthropic's model for hard, long tasks. Opus 5.5 now does almost all my work. Haiku 5.5 moves to Adopt. It does the small jobs, such as a quick check of each change my agents make. Fable 5.1 and Sonnet 5.5 move to Trial. I use them only for a few narrow jobs. Codex is OpenAI's coding agent, and GPT-6.1 Sol is its model. Both go to Hold. I cancelled my Codex plan on 5 October and last used it on 13 October. The models fell short for my work.

T3 Code moves to Adopt. It is the app where I start and watch my agents. This radar calls such an app a harness. T3 Code now also starts my scheduled agent runs. MLX Whisper (speech-to-text on my Mac), Nano Banana 2.1 (images) and TypeSafe Jev 1.13 (a cheap yes-or-no checker for text) move to Adopt as my defaults. Computer use, where an agent clicks and types in Mac apps for me, comes back in Trial. One new Infrastructure entry, Local models for agent work, goes to Assess.

I rewrote the practices for people who build products. They go from 12 to 8. The main change: I stopped my own review of agent work. Automatic checks now decide what ships, as Guardrails, not manual review explains. Mask personal data before a model sees it moves to Adopt. Four practices are new. Under [Not on the radar](https://productradar.org/about/#rejected), I list 9 tools that I left off, each with its reason."""

[[edition]]
date = 2026-10-30
title = "A phone line to my agents, and Haiku takes over from Sonnet"
note = "My agents now reach me by phone, with texts and podcasts next. Three new entries in Trial cover how. Haiku 5.5 took over Sonnet's jobs wherever a test showed it was good enough."
body = """
Three entries are new, all in Trial. ElevenLabs Agents runs the phone line I built to talk to my agents. Let agents reach you by push is the practice behind it. My agents now come to me. They no longer leave notes I must open. Pick a direction before agents build creative work comes from one project. I pick a direction first and see a rough version early.

No ring changed this week, but the reasons for three models did. I now swap Sonnet 5.5 for Haiku 5.5 wherever a test allows it. Sonnet keeps web searches and one final check, where Haiku fell short. Opus 5.5 stays my default model, because I would rather wait for a better answer.

I also measured Parallel against agent-browser for reading public pages, and Parallel stays my default. Eight other entries got clearer text after last week's reviews."""

[[blip]]
