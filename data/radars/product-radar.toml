status = "confirmed"
rationale = """
Fable 5.1 was my main model in Edition 01. Fable is Anthropic's model for hard reasoning and long, multi-step tasks. Now Opus 5.5 does my daily work.

Last week Fable gave under 2% of the answers in the agent sessions I run myself. Opus 5.5 gave the rest. My helper agents never use Fable. Helper agents are agents that my main agent starts for one part of a job.

It stays in Trial because I still start a few sessions on it. If I stop using it, it moves to Hold. If you pick one Claude model for everyday work, start with Opus. Use Haiku for quick checks."""
