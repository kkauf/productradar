[[blip]]
entry = "guardrails-not-manual-review"
status = "confirmed"
rationale = """
I no longer read every result my agents produce. I set the guardrails once, and the agents ship inside them.

Automatic tests run before anything goes live. Before each release, tests click through a test copy of the product. For each bug I report, an agent first writes a test that fails because of the bug. Then it fixes the code until the test passes. A Haiku agent clicks through each change as a user would.

Software checks risky agent actions before they run, such as sending a message or reading a private file. Agents cannot turn that off. Before each release, a reviewer agent checks the change. It is Sonnet 5.5, a different Claude model that starts fresh.

Five reviewer agents read each edition of this radar as a visitor would. It ships only when all of them pass it. It sits in Trial because I stopped my own review this week. A mistake that no check covers can still ship."""
[[blip.history]]
date = 2026-10-22
ring = "trial"
note = "New: replaces four narrower entries."

[[blip]]
entry = "least-privilege-keys"
status = "confirmed"
rationale = """
A key is a password-like code that lets software act inside an account. Before an agent takes a key, I have it weigh the damage that key could do against what it gains. It takes the narrowest key that does the job.

On 21 October an agent needed a key for a hosting account. It chose a key limited to a single project over a key for the whole account. That same day the hosting company, Railway, published a security notice. A narrow key limits the damage when a provider has a problem.

The same rule holds for money. My agents can spend only within a small limit that I set, and only after I approve the use."""
[[blip.history]]
date = 2026-10-22
ring = "trial"
note = "New: the lesson from a host's security notice."

[[blip]]
entry = "flow-check"
status = "confirmed"
rationale = """
pstack is a free set of ready-made instructions for coding agents, called skills. A developer who posts as poteto on X shared it. One skill finds bugs in a user flow. I tried it in October.

An agent draws the user flow as a plain-language chart. It shows each situation a user can be in and the events that move them on. A small program then tries every order of events, including retries and events at the same time.

My first chart was of a user flow that sends messages. The program found 6 flaws in its design. Then my agents checked four user flows at Kaufmann Health, my therapist-matching company. The program found 16 bugs a user could hit. The fixes shipped in the next release.

I can read the chart without the code. So bugs show up before users hit them."""
