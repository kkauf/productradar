[[blip]]
entry = "t3-code"
status = "confirmed"
rationale = """
T3 Code is the app where I start and watch my agents every day. This radar calls such an app a harness. It also starts my scheduled agent runs.

Six scheduled agent runs each weekday work through my inbox and tasks. More runs start when I record a voice memo or write a note. A long-running agent forgets earlier work once its memory fills, so each run starts a fresh agent.

Claude Code, the agent under my work, could not do this alone. macOS blocked a scheduled run of Claude Code from my iCloud files. Anthropic's cloud scheduler cannot reach files on my Mac.

T3's phone app pings me when an agent needs me. It is Adopt because I run my agents in it every day. One gap remains: it cannot operate other Mac apps by itself."""
