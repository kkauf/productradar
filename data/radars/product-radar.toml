status = "confirmed"
rationale = """
I almost never talk to Sonnet 5.5 directly. Last week I sent it 1 request in my own sessions. My helper agents sent it 2,993.

This week I tested where Haiku 5.5 can replace it, because Haiku costs much less. Sonnet kept two jobs. The first is web searches for my agents. Haiku gave thinner answers on all 3 test searches. The second is a final check of agent work before it reaches me. There Haiku agreed with Sonnet only 67% of the time. Two Sonnet runs agreed only 69% of the time, so that test is noisy.

Sonnet stays in Trial for these two jobs. A test where Haiku matches it would move Sonnet to Hold."""
