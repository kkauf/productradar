rationale = """
Opus 5.5 is my default model. Opus, Sonnet and Haiku are Anthropic's Claude models, from largest to smallest. Last week it answered 36,217 requests in my own sessions and 25,357 from helper agents.

It does the work that needs judgment. It plans a job, writes the code for a feature and decides which helper agent does which part. My scheduled agent runs also use it.

